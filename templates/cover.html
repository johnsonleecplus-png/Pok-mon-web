{{define "cover.html"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/pokeball.svg{{staticVer "/static/pokeball.svg"}}">
  <title>MARS-宝可梦卡牌库</title>
  <link rel="prefetch" href="/app">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #F8F9F4;  /* 与 /app 一致: HOME 米白 */
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    a.cover {
      display: block; width: 100vw; height: 100vh;
      position: relative; cursor: pointer;
      text-decoration: none; overflow: hidden;
      background: #F8F9F4;
    }

    /* === 极轻 vignette 仅为增强中心, 不压暗背景 === */
    a.cover::before {
      content: '';
      position: absolute; inset: 0; z-index: 4;
      background:
        radial-gradient(ellipse 60% 50% at center, rgba(0, 159, 122, 0.04) 0%, transparent 70%),
        radial-gradient(ellipse 90% 90% at center, transparent 60%, rgba(0, 159, 122, 0.05) 100%);
      pointer-events: none;
    }

    /* === 三层滚动宝可梦 (浅色装饰模式) === */
    .layer {
      position: absolute; left: 0;
      pointer-events: none;
      will-change: transform;
      display: flex;
      align-items: center;
      width: 100%;
      overflow: visible;
    }
    .layer-far {
      top: 16%; height: 18%;
      opacity: 0.18;
      filter: blur(3px) saturate(0.55) brightness(1.15);
    }
    .layer-mid {
      top: 40%; height: 24%;
      opacity: 0.22;
      filter: blur(0.6px) saturate(0.7) brightness(1.08);
    }
    .layer-near {
      top: 74%; height: 22%;
      opacity: 0.28;
      filter: saturate(0.85) brightness(1.04);
    }
    .sprite-track {
      display: flex;
      flex-shrink: 0;
      height: 100%;
      width: max-content;
      gap: 0;
    }
    .layer-far .sprite-track { animation: scroll-left 70s linear infinite; }
    .layer-mid .sprite-track { animation: scroll-right 90s linear infinite; }
    .layer-near .sprite-track { animation: scroll-left 45s linear infinite; }
    .sprite-track img {
      height: 100%;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    @keyframes scroll-left {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }
    @keyframes scroll-right {
      from { transform: translate3d(-50%, 0, 0); }
      to   { transform: translate3d(0, 0, 0); }
    }

    /* === 中央文字区: 米白 + Pokemon HOME 绿主题 === */
    .center-mask {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 880px);
      padding: 56px 72px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      border-radius: 28px;
      border: 1px solid rgba(0, 159, 122, 0.18);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.6),
        0 24px 60px rgba(0, 80, 60, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      text-align: center;
      z-index: 6;
      pointer-events: none;
    }
    .brand-title {
      font-size: clamp(34px, 5vw, 60px);
      font-weight: 900;
      color: #0a6e54;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }
    .brand-sub {
      font-size: clamp(15px, 1.6vw, 20px);
      color: #4a5a55;
      font-weight: 500; letter-spacing: 2px;
    }

    /* 跳转中态, 防止 /app 加载时白屏 */
    .cover.loading { opacity: 0.85; transition: opacity 0.15s; }
  </style>
</head>
<body>
  <a href="/app" class="cover" aria-label="进入 MARS-宝可梦卡牌库" id="coverLink">
    <div class="layer layer-far">
      <div class="sprite-track">
        <img src="/static/pokes/far_loop.png{{staticVer "/static/pokes/far_loop.png"}}" alt="">
        <img src="/static/pokes/far_loop.png{{staticVer "/static/pokes/far_loop.png"}}" alt="">
      </div>
    </div>
    <div class="layer layer-mid">
      <div class="sprite-track">
        <img src="/static/pokes/mid_loop.png{{staticVer "/static/pokes/mid_loop.png"}}" alt="">
        <img src="/static/pokes/mid_loop.png{{staticVer "/static/pokes/mid_loop.png"}}" alt="">
      </div>
    </div>
    <div class="layer layer-near">
      <div class="sprite-track">
        <img src="/static/pokes/near_loop.png{{staticVer "/static/pokes/near_loop.png"}}" alt="">
        <img src="/static/pokes/near_loop.png{{staticVer "/static/pokes/near_loop.png"}}" alt="">
      </div>
    </div>

    <div class="center-mask">
      <div class="brand-title">MARS-宝可梦卡牌库</div>
      <div class="brand-sub">Pokémon TCG Collection · 20,444 cards · 174 sets</div>
    </div>
  </a>
  <script>
    document.getElementById('coverLink').addEventListener('click', function() {
      this.classList.add('loading');
    });
  </script>
</body>
</html>
{{end}}
